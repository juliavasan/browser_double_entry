<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bulk Entry</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <h1>Bulk Entry</h1>
    <p class="lead">Enter records from a JSON file into a web app's forms, using the session you're already logged in with.</p>

    <section>
      <label class="file">
        <span>1. Choose a JSON file</span>
        <input type="file" id="file" accept=".json,application/json">
      </label>
      <p id="summary" class="note"></p>
    </section>

    <section>
      <button id="start" disabled>2. Start</button>
      <p id="status" class="note"></p>
    </section>

    <table id="results" hidden>
      <thead>
        <tr><th>#</th><th>Record</th><th>System</th><th>Result</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <button id="download" class="secondary" hidden>Save results as a file</button>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
