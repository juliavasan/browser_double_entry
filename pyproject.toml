[project]
name = "browser-double-entry"
version = "0.1.0"
description = "POC: enter data from one JSON file into multiple web systems by driving the browser over CDP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bde = "browser_double_entry.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
